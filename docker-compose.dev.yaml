services:
  bcp_client:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: "bcp_client_frontend"
    restart: always
    env_file:
      - .env.development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules

  bcp_backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile.dev
    container_name: bcp_backend
    environment:
      - POSTGRES_DB=postgres
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/balance_comission
    volumes:
      - ./backend:/backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - .env.development
    command: python backend/balance.py
    depends_on:
      - db

  db:
    container_name: bcp_PGDB
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: balance_comission
    volumes:
      - postgres:/var/lib/postgresql_15/data
    ports:
      - 5431:5432

